name: Build & Release linkpc Clients

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      target:
        description: 'Платформа для сборки'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - windows
          - android
          - macos
          - linux

permissions:
  contents: write

jobs:
  # ==========================================
  # WINDOWS BUILD (~1.5 - 2 minutes)
  # ==========================================
  build-windows:
    name: Build Windows Client
    if: inputs.target == 'all' || inputs.target == 'windows' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' && inputs.target == null
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          cache-key: 'flutter-:os:-:channel:-:version:'

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows Executable
        run: flutter build windows --release

      - name: Bundle sing-box core and wintun
        run: |
          Invoke-WebRequest -Uri "https://vless.linkpc.net/downloads/sing-box.exe" -OutFile "build\windows\x64\runner\Release\sing-box.exe"
          Invoke-WebRequest -Uri "https://vless.linkpc.net/downloads/wintun.dll" -OutFile "build\windows\x64\runner\Release\wintun.dll"

      - name: Package Windows Zip
        run: |
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath linkpc-windows-x64.zip

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linkpc-windows
          path: linkpc-windows-x64.zip

      - name: Fast Release Upload
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: linkpc-windows-x64.zip

  # ==========================================
  # ANDROID BUILD (~1.5 - 2 minutes)
  # ==========================================
  build-android:
    name: Build Android APK
    if: inputs.target == 'all' || inputs.target == 'android' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' && inputs.target == null
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          cache-key: 'flutter-:os:-:channel:-:version:'

      - name: Install dependencies
        run: flutter pub get

      - name: Fast Build Android APK
        run: |
          flutter build apk --release --android-skip-build-dependency-validation
          mkdir -p output
          cp build/app/outputs/flutter-apk/app-release.apk output/linkpc-android.apk

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linkpc-android
          path: output/linkpc-android.apk

      - name: Fast Release Upload
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: output/linkpc-android.apk

  # ==========================================
  # MACOS BUILD
  # ==========================================
  build-macos:
    name: Build macOS Application
    if: inputs.target == 'all' || inputs.target == 'macos' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' && inputs.target == null
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          cache-key: 'flutter-:os:-:channel:-:version:'

      - name: Enable macOS Desktop
        run: flutter config --enable-macos-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Build macOS (.app)
        run: |
          flutter build macos --release
          cd build/macos/Build/Products/Release
          codesign --force --deep --sign - linkpc.app || true
          zip -r -y ../../../../../linkpc-macos.zip linkpc.app
          cd ../../../../..

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linkpc-macos
          path: linkpc-macos.zip

      - name: Fast Release Upload
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: linkpc-macos.zip

  # ==========================================
  # LINUX BUILD
  # ==========================================
  build-linux:
    name: Build Linux Client
    if: inputs.target == 'all' || inputs.target == 'linux' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' && inputs.target == null
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          cache-key: 'flutter-:os:-:channel:-:version:'

      - name: Enable Linux Desktop
        run: flutter config --enable-linux-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Build Linux
        run: flutter build linux --release

      - name: Package Linux tar.gz
        run: |
          tar -czvf linkpc-linux-x64.tar.gz -C build/linux/x64/release/bundle .

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linkpc-linux
          path: linkpc-linux-x64.tar.gz

      - name: Fast Release Upload
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: linkpc-linux-x64.tar.gz
