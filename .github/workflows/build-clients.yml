name: Build Clients (Artifacts & CI)

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Платформа для сборки'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - windows
          - android
          - macos
          - linux
          - ios

permissions:
  contents: write

jobs:
  # ==========================================
  # WINDOWS BUILD (~1.5 - 2 minutes)
  # ==========================================
  build-windows:
    name: Build Windows Client
    if: inputs.target == 'all' || inputs.target == 'windows' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' && inputs.target == null
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows Executable
        run: flutter build windows --release --dart-define=APP_VERSION=${{ github.ref_name }}

      - name: Bundle sing-box core and wintun
        run: |
          try {
            Invoke-WebRequest -Uri "https://vless.linkpc.net/downloads/sing-box.exe" -OutFile "build\windows\x64\runner\Release\sing-box.exe"
          } catch {
            curl.exe -L -o sb.zip "https://github.com/SagerNet/sing-box/releases/download/v1.13.19/sing-box-1.13.19-windows-amd64.zip"
            Expand-Archive -Path sb.zip -DestinationPath sb_t
            Get-ChildItem -Path sb_t -Recurse -Filter "sing-box.exe" | Copy-Item -Destination "build\windows\x64\runner\Release\"
          }
          try {
            Invoke-WebRequest -Uri "https://vless.linkpc.net/downloads/wintun.dll" -OutFile "build\windows\x64\runner\Release\wintun.dll"
          } catch {
            curl.exe -L -o wt.zip "https://www.wintun.net/builds/wintun-0.14.1.zip"
            Expand-Archive -Path wt.zip -DestinationPath wt_t
            Copy-Item "wt_t\wintun\bin\amd64\wintun.dll" -Destination "build\windows\x64\runner\Release\"
          }

      - name: Package Windows Zip
        run: |
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath linkpc-windows-x64.zip

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linkpc-windows
          path: linkpc-windows-x64.zip

      - name: Fast Release Upload
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: linkpc-windows-x64.zip

  # ==========================================
  # ANDROID BUILD (~1.5 - 2 minutes)
  # ==========================================
  build-android:
    name: Build Android APK
    if: inputs.target == 'all' || inputs.target == 'android' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' && inputs.target == null
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Cache libbox.aar
        id: cache-libbox
        uses: actions/cache@v4
        with:
          path: android/app/libs/libbox.aar
          key: libbox-aar-1.14.4

      - name: Bundle libbox.aar core
        if: steps.cache-libbox.outputs.cache-hit != 'true'
        run: |
          mkdir -p android/app/libs
          echo "Downloading sing-box libbox.aar core..."
          curl -L -o android/app/libs/libbox.aar "https://vless.linkpc.net/downloads/libbox.aar" || \
          curl -L -o android/app/libs/libbox.aar "https://github.com/singbox-android/libbox/releases/download/1.14.4/libbox.aar"

      - name: Fast Build Android APK (arm64-v8a)
        run: |
          flutter build apk --release --target-platform android-arm64 --android-skip-build-dependency-validation --dart-define=APP_VERSION=${{ github.ref_name }}
          mkdir -p output
          # 64-bit ARM APK only (99.9% of modern phones, ~35MB)
          cp build/app/outputs/flutter-apk/app-release.apk output/linkpc-android.apk
          cp build/app/outputs/flutter-apk/app-release.apk output/linkpc-android-arm64.apk

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linkpc-android
          path: output/*.apk

      - name: Fast Release Upload
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: output/*.apk

  # ==========================================
  # MACOS BUILD
  # ==========================================
  build-macos:
    name: Build macOS Application
    if: inputs.target == 'all' || inputs.target == 'macos' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' && inputs.target == null
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable macOS Desktop
        run: flutter config --enable-macos-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Build macOS (.app)
        run: |
          flutter build macos --release --dart-define=APP_VERSION=${{ github.ref_name }}
          
          # Bundle universal sing-box core into linkpc.app
          echo "Downloading sing-box binaries for arm64 and amd64..."
          curl -L -o sb_arm64.tar.gz "https://github.com/SagerNet/sing-box/releases/download/v1.13.19/sing-box-1.13.19-darwin-arm64.tar.gz"
          curl -L -o sb_amd64.tar.gz "https://github.com/SagerNet/sing-box/releases/download/v1.13.19/sing-box-1.13.19-darwin-amd64.tar.gz"
          mkdir -p sb_arm sb_intel
          tar -xzf sb_arm64.tar.gz -C sb_arm
          tar -xzf sb_amd64.tar.gz -C sb_intel
          
          DEST="build/macos/Build/Products/Release/linkpc.app/Contents/MacOS/sing-box"
          echo "Creating universal binary with lipo..."
          lipo -create -output "$DEST" sb_arm/*/sing-box sb_intel/*/sing-box
          chmod +x "$DEST"
          
          # Sign sing-box binary, then sign the entire bundle ad-hoc
          codesign --force --sign - "$DEST"
          codesign --force --deep --sign - build/macos/Build/Products/Release/linkpc.app || true
          
          cd build/macos/Build/Products/Release
          zip -r -y ../../../../../linkpc-macos.zip linkpc.app
          cd ../../../../..

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linkpc-macos
          path: linkpc-macos.zip

      - name: Fast Release Upload
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: linkpc-macos.zip

  # ==========================================
  # IOS BUILD (Unsigned IPA for AltStore / Sideloadly / TrollStore)
  # ==========================================
  build-ios:
    name: Build iOS IPA
    if: inputs.target == 'all' || inputs.target == 'ios' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' && inputs.target == null
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS App (unsigned)
        run: |
          flutter build ios --release --no-codesign --dart-define=APP_VERSION=${{ github.ref_name }}
          mkdir -p build/ios/iphoneos/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload/
          cd build/ios/iphoneos
          zip -r -y ../../../linkpc-ios.ipa Payload
          cd ../../..

      - name: Upload iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linkpc-ios
          path: linkpc-ios.ipa

      - name: Fast Release Upload
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: linkpc-ios.ipa

  # ==========================================
  # LINUX BUILD
  # ==========================================
  build-linux:
    name: Build Linux Client
    if: inputs.target == 'all' || inputs.target == 'linux' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' && inputs.target == null
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Linux Desktop
        run: flutter config --enable-linux-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Build Linux
        run: |
          flutter build linux --release --dart-define=APP_VERSION=${{ github.ref_name }}
          curl -L -o sb_linux.tar.gz "https://github.com/SagerNet/sing-box/releases/download/v1.13.19/sing-box-1.13.19-linux-amd64.tar.gz"
          mkdir -p sb_l
          tar -xzf sb_linux.tar.gz -C sb_l
          cp sb_l/*/sing-box build/linux/x64/release/bundle/sing-box
          chmod +x build/linux/x64/release/bundle/sing-box

      - name: Package Linux tar.gz
        run: |
          tar -czvf linkpc-linux-x64.tar.gz -C build/linux/x64/release/bundle .

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linkpc-linux
          path: linkpc-linux-x64.tar.gz

      - name: Fast Release Upload
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: linkpc-linux-x64.tar.gz
