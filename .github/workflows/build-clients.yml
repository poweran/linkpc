name: Build & Release linkpc Clients

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build APKs (Split per ABI & Universal)
        run: |
          flutter build apk --release --split-per-abi --android-skip-build-dependency-validation
          flutter build apk --release --android-skip-build-dependency-validation

      - name: Rename & Organize Artifacts
        run: |
          mkdir -p output
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk output/linkpc-android-arm64-v8a.apk || true
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk output/linkpc-android-armeabi-v7a.apk || true
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk output/linkpc-android-x86_64.apk || true
          cp build/app/outputs/flutter-apk/app-release.apk output/linkpc-android-universal.apk

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linkpc-android
          path: output/*.apk

  build-windows:
    name: Build Windows Client
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows Executable
        run: flutter build windows --release

      - name: Package Windows Zip
        run: |
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath linkpc-windows-x64.zip

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linkpc-windows
          path: linkpc-windows-x64.zip

  build-macos:
    name: Build macOS Application
    runs-on: macos-13
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable macOS Desktop
        run: flutter config --enable-macos-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Build macOS (.app)
        run: flutter build macos --release

      - name: Package macOS Zip
        run: |
          cd build/macos/Build/Products/Release
          zip -r -y ../../../../../linkpc-macos.zip linkpc.app
          cd ../../../../..

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linkpc-macos
          path: linkpc-macos.zip

  build-linux:
    name: Build Linux Client
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Linux Desktop
        run: flutter config --enable-linux-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Build Linux
        run: flutter build linux --release

      - name: Package Linux tar.gz
        run: |
          tar -czvf linkpc-linux-x64.tar.gz -C build/linux/x64/release/bundle .

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linkpc-linux
          path: linkpc-linux-x64.tar.gz

  release:
    name: Publish GitHub Release
    needs: [build-android, build-windows, build-macos, build-linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/linkpc-android/*.apk
            release-assets/linkpc-windows/*.zip
            release-assets/linkpc-macos/*.zip
            release-assets/linkpc-linux/*.tar.gz
          name: linkpc ${{ github.ref_name }}
          draft: false
          prerelease: false
          body: |
            ### linkpc Client Release ${{ github.ref_name }}
            
            Высокоскоростной сверхлегкий клиент сетевого шлюза linkpc (sing-box libbox core) для безопасного доступа к корпоративной сети и зарубежным AI-сервисам.
            
            #### Поддерживаемые платформы:
            - **Android**: `linkpc-android-arm64-v8a.apk`, `linkpc-android-universal.apk`
            - **Windows**: `linkpc-windows-x64.zip`
            - **macOS**: `linkpc-macos.zip`
            - **Linux**: `linkpc-linux-x64.tar.gz`
            
            #### Основные особенности:
            - Ультра-легковесный запуск
            - Прямая поддержка протокола VLESS-XHTTP
            - Умное разделение трафика (RU напрямую, блокировки и AI через шлюз)
            - Подключение в 1 нажатие с анимированной индикацией
            - Автоматический импорт подписки по протоколу `linkpc://`
